# Banco H2 local persistente. Não exige instalação do PostgreSQL.
spring.datasource.url=jdbc:h2:file:./data/helpdb;MODE=PostgreSQL;AUTO_SERVER=TRUE;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.hikari.connection-timeout=10000

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Console web do H2
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Chave apenas para desenvolvimento local. Em produção, use JWT_SECRET.
api.security.token.secret=${JWT_SECRET:chave-local-segura-com-mais-de-32-caracteres-help}

# Mercado Pago. Substitua SEU_TOKEN por uma credencial de teste ou defina a variável de ambiente.
mercadopago.access-token=${MERCADOPAGO_ACCESS_TOKEN:SEU_TOKEN}
