name: Validar comunicacao social

on:
  push:
    branches:
      - feat/comunicacao-social-contas

jobs:
  backend-social:
    name: Backend social Java 21
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Help
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Executar teste social
        run: mvn -B -Dtest=ParticipanteAutenticadoServiceTest test
